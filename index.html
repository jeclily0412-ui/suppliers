// ===== 解析資料 =====
const data = [];
RAW.trim().split('\n').forEach(line => {
  if (!line.trim()) return;
  const p = line.split('|');
  if (p.length < 6) return;
  const cat = p[0].trim(); // 1=小包, 2=材料設備商
  const grade = p[1].trim();
  const type = p[2].trim();
  const area = p[3].trim();
  const taxId = p[4].trim();
  const name = p[5].trim();
  const contact = p[6] ? p[6].trim() : '';
  const phone = p[7] ? p[7].trim() : '';
  const addr = p[8] ? p[8].trim() : '';
  const note = p[9] ? p[9].trim() : '';
  if (!name) return;
  const isBad = note.includes('❌') || ['D'].includes(grade);
  const isNew = note.includes('★新增');
  data.push({cat, grade, type, area, taxId, name, contact, phone, addr, note, isBad, isNew});
});

// ===== 篩選狀態 =====
let activeArea = '全部', activeCat = '全部';

function buildFilters() {
  const bar = document.getElementById('filterBar');
  const areas = ['全部','北','中','南','全省'];

  const cats = ['全部','小包工程商','材料設備商'];

  bar.innerHTML = `
    <span class="fb-label">📂</span>
    ${cats.map(c=>`<button class="fb-btn${activeCat===c?' active':''}" onclick="setCat('${c}')">${c}</button>`).join('')}
    <span class="fb-sep">|</span>
    <span class="fb-label">📍</span>
    ${areas.map(a=>`<button class="fb-btn${activeArea===a?' active':''}" onclick="setArea('${a}')">${a}</button>`).join('')}

  `;
}

function setCat(v){activeCat=v;buildFilters();render()}
function setArea(v){activeArea=v;buildFilters();render()}

function hl(txt, q) {
  if (!q || !txt) return txt||'';
  return txt.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m=>`<mark>${m}</mark>`);
}

function areaMatch(area, filter) {
  if (filter === '全部') return true;
  const aMap = {'北':['北','台北','新北','雙北','桃園','新竹','基隆','宜蘭'],'中':['中','台中','彰化','南投','苗栗','雲林'],'南':['南','台南','高雄','嘉義','屏東']};
  const targets = aMap[filter] || [filter];
  return targets.some(t => area.includes(t));
}

function renderCard(d, q) {
  const gc = d.grade || 'X';
  const borderColor = {A:'#27ae60',B:'#2980b9',C:'#e67e22',D:'#e74c3c','未合作':'#9b59b6',X:'#ddd'}[gc]||'#ddd';
  return `<div class="card${d.isBad?' bad':''}${d.isNew?' new-card':''}" style="border-left-color:${borderColor}">
    ${d.isNew?`<div class="new-badge">NEW</div>`:''}
    <div class="card-name">${hl(d.name,q)}</div>
    <div class="card-meta">
      ${d.type?`<span class="tag type">${hl(d.type,q)}</span>`:''}
      ${d.area?`<span class="tag area">${hl(d.area,q)}</span>`:''}
      <span class="tag cat" style="background:${d.cat==='1'?'#eaf4ff':'#fef3e7'};color:${d.cat==='1'?'#1a5a8c':'#9a4e00'}">${d.cat==='1'?'小包':'材料設備'}</span>
    </div>
    <div class="card-info">
      ${d.contact?`<span>👤 ${hl(d.contact,q)}</span>`:''}
      ${d.phone?`<span>📞 ${hl(d.phone,q)}</span>`:''}
      ${d.taxId?`<span>🪪 ${d.taxId}</span>`:''}
      ${d.addr?`<span>📍 ${hl(d.addr,q)}</span>`:''}
    </div>
    ${d.note?`<div class="card-note${d.isBad?' bad':''}">📝 ${hl(d.note,q)}</div>`:''}
  </div>`;
}

function render() {
  const q = document.getElementById('searchInput').value.trim();
  let filtered = data;
  if (activeCat !== '全部') filtered = filtered.filter(d => activeCat==='小包工程商'?d.cat==='1':d.cat==='2');
  if (activeArea !== '全部') filtered = filtered.filter(d => areaMatch(d.area, activeArea));
  if (q) {
    const ql = q.toLowerCase();
    filtered = filtered.filter(d => [d.name,d.type,d.area,d.contact,d.phone,d.addr,d.note,d.taxId,d.grade].some(v=>v&&v.toLowerCase().includes(ql)));
  }
  const total = data.length;
  document.getElementById('stats').textContent = `顯示 ${filtered.length} 筆 / 共 ${total} 筆（小包 ${data.filter(d=>d.cat==='1').length} ｜ 材料設備 ${data.filter(d=>d.cat==='2').length}）`;
  if (!filtered.length) {
    document.getElementById('content').innerHTML='<div class="no-result">😶 沒有符合的廠商</div>';
    return;
  }
  const grouped = {};
  filtered.forEach(d => {
    const k = d.type||'其他';
    if (!grouped[k]) grouped[k] = [];
    grouped[k].push(d);
  });
  const keys = Object.keys(grouped).sort((a,b)=>a.localeCompare(b,'zh-TW'));
  document.getElementById('content').innerHTML = keys.map(k=>`
    <div class="section">
      <div class="sec-title">${k} <span class="cnt">${grouped[k].length}</span></div>
      <div class="cards">${grouped[k].map(d=>renderCard(d,q)).join('')}</div>
    </div>`).join('');
}

buildFilters();
render();
</script>
